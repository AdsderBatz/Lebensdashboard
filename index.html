<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191919">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Tägliche To-Dos, Aufgaben, Fokus-Timer und Statistik.">
  <title>Lebensdashboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Startbildschirm: wird sofort gezeigt, die Logik hängt js/app.js an -->
  <div id="splash">
    <figure class="splash-quote"><blockquote id="splash-text"></blockquote><figcaption id="splash-author"></figcaption></figure>
  </div>
  <script>
    (function () {
      try {
        if (localStorage.getItem("ld.focus.running")) {
          document.getElementById("splash").remove();
          return;
        }
        var list = JSON.parse(localStorage.getItem("ld.quotes.cache") || "[]");
        if (!list.length) list = [{ text: "Stay hard.", author: "David Goggins" }];
        var last = localStorage.getItem("ld.quotes.last");
        var q = list[Math.floor(Math.random() * list.length)];
        for (var i = 0; i < 6 && list.length > 1 && q.text === last; i++) q = list[Math.floor(Math.random() * list.length)];
        localStorage.setItem("ld.quotes.last", q.text);
        window.__ldQuote = q;
        document.getElementById("splash-text").textContent = q.text;
        document.getElementById("splash-author").textContent = q.author ? "— " + q.author : "";
      } catch (e) {}
    })();
  </script>

  <main id="view"></main>
  <nav id="tabbar" aria-label="Hauptnavigation" hidden></nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">Diese App braucht JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
